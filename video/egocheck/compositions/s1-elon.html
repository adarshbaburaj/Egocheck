<template>
  <style>
    #root { position: absolute; inset: 0; background: #0a0a0a; overflow: hidden; font-family: "Montserrat", sans-serif; }
    #s1-svg { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
    .s1-ink { fill: none; stroke: #f2f2ee; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .s1-cap { position: absolute; left: 0; right: 0; top: 912px; text-align: center; color: #f2f2ee; font-size: 64px;
              font-weight: 700; letter-spacing: -0.02em; }
    .s1-cap b { color: #8fd45e; font-weight: 700; }
    .s1-pop { filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.65)); }
  </style>
  <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
    <svg id="s1-svg" viewBox="0 0 1920 1080">
      <defs>
        <filter id="s1-boil" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence id="s1-turb" type="fractalNoise" baseFrequency="0.035" numOctaves="1" seed="1" />
          <feDisplacementMap in="SourceGraphic" scale="3.2" />
        </filter>
      </defs>
      <!-- the "screen" the story lives in; props break out of it -->
      <rect id="s1-screen" x="160" y="100" width="1600" height="780" rx="40" fill="#111" stroke="#2c2c2c" stroke-width="4" />
      <line id="s1-floor" x1="300" y1="800" x2="1620" y2="800" class="s1-ink" stroke-opacity="0.25" stroke-width="4" />

      <g filter="url(#s1-boil)">
        <!-- Elon -->
        <g id="s1-elon" transform="translate(860 800)">
          <g id="s1-elon-body">
            <path id="s1-legs" class="s1-ink" d="M -32 0 L 0 -112 L 32 0" pathLength="1" />
            <path id="s1-torso" class="s1-ink" d="M 0 -112 L 0 -232" pathLength="1" />
            <g id="s1-armL"><path class="s1-ink" d="M 0 -214 L -58 -150" pathLength="1" /></g>
            <g id="s1-armR"><path class="s1-ink" d="M 0 -214 L 62 -158" pathLength="1" /></g>
            <circle id="s1-head" class="s1-ink" cx="0" cy="-280" r="46" pathLength="1" />
            <path id="s1-hair" class="s1-ink" d="M -14 -324 Q -2 -352 22 -336" pathLength="1" />
            <circle id="s1-eyeL" cx="-16" cy="-286" r="5" fill="#f2f2ee" />
            <circle id="s1-eyeR" cx="16" cy="-286" r="5" fill="#f2f2ee" />
            <path id="s1-mouth" class="s1-ink" stroke-width="5" d="M -16 -262 Q 0 -250 16 -262" />
          </g>
        </g>

        <!-- thought bubble that pops OUT of the screen top -->
        <g id="s1-bubble" class="s1-pop">
          <circle cx="930" cy="440" r="10" class="s1-ink" stroke-width="5" />
          <circle cx="975" cy="388" r="16" class="s1-ink" stroke-width="5" />
          <path class="s1-ink" fill="#0a0a0a"
                d="M 930 330 C 870 330 860 250 930 238 C 930 160 1040 140 1070 196 C 1110 120 1240 140 1240 214
                   C 1320 214 1330 320 1250 330 C 1250 380 1140 392 1110 350 C 1070 392 960 384 930 330 Z" />
          <!-- robot head inside -->
          <g id="s1-robot">
            <rect x="1030" y="222" width="120" height="96" rx="18" class="s1-ink" stroke="#8fd45e" />
            <circle cx="1065" cy="266" r="11" fill="#8fd45e" />
            <circle cx="1115" cy="266" r="11" fill="#8fd45e" />
            <path d="M 1062 298 L 1118 298" class="s1-ink" stroke="#8fd45e" stroke-width="5" />
            <g id="s1-antenna"><path d="M 1090 222 L 1090 186" class="s1-ink" stroke="#8fd45e" stroke-width="5" />
              <circle cx="1090" cy="178" r="9" fill="#8fd45e" /></g>
          </g>
        </g>
      </g>
    </svg>

    <div id="s1-c1" class="s1-cap clip" data-start="0.9" data-duration="1.3">This is Elon.</div>
    <div id="s1-c2" class="s1-cap clip" data-start="2.2" data-duration="1.0">He wants to build</div>
    <div id="s1-c3" class="s1-cap clip" data-start="3.2" data-duration="1.2">a <b>robot brain.</b></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const seen = new Set();
    const F = (t, f, v, at) => { const els = gsap.utils.toArray(t); v.immediateRender = !els.some(e => seen.has(e)); els.forEach(e => seen.add(e)); return tl.fromTo(t, f, v, at); };
    const D = 4.4;
    // hand-drawn boil: re-seed the wobble 12x a second (deterministic)
    tl.fromTo("#s1-turb", { attr: { seed: 1 } }, { attr: { seed: 1 + D * 12 }, duration: D, ease: `steps(${D * 12})` }, 0);

    // the screen draws in
    F("#s1-screen", { opacity: 0, scale: 0.96, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
    F("#s1-floor", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.2);

    // Elon draws himself, head first
    const parts = ["#s1-head", "#s1-hair", "#s1-torso", "#s1-armL path", "#s1-armR path", "#s1-legs"];
    parts.forEach((p, i) => F(p, { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out" }, 0.25 + i * 0.1));
    F(["#s1-eyeL", "#s1-eyeR", "#s1-mouth"], { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.75);

    // he notices us and waves (arm leads, body follows)
    F("#s1-armR", { rotation: 0, svgOrigin: "860 586" }, { rotation: -115, duration: 0.25, ease: "back.out(2)" }, 0.95);
    [0, 1, 2].forEach(i => {
      F("#s1-armR", { rotation: -115 }, { rotation: -80, duration: 0.14, ease: "sine.inOut" }, 1.2 + i * 0.28);
      F("#s1-armR", { rotation: -80 }, { rotation: -115, duration: 0.14, ease: "sine.inOut" }, 1.34 + i * 0.28);
    });
    F("#s1-armR", { rotation: -115 }, { rotation: 0, duration: 0.3, ease: "power2.inOut" }, 2.1);
    F("#s1-elon-body", { rotation: 0, svgOrigin: "860 800" }, { rotation: -4, duration: 0.3, ease: "sine.inOut" }, 1.0);
    F("#s1-elon-body", { rotation: -4 }, { rotation: 0, duration: 0.4, ease: "sine.inOut" }, 2.0);
    // blink
    F(["#s1-eyeL", "#s1-eyeR"], { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: 0.1, duration: 0.06, yoyo: true, repeat: 1 }, 1.75);

    // captions punch in from "outside the screen" (big -> settle)
    ["#s1-c1", "#s1-c2", "#s1-c3"].forEach((c, i) => {
      const at = [0.9, 2.2, 3.2][i];
      F(c, { opacity: 0, scale: 1.5, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, at);
    });

    // he looks up and thinks: chin up, the bubble POPS out past the screen edge
    F("#s1-elon-body", { rotation: 0 }, { rotation: 3, duration: 0.3, ease: "power2.out" }, 2.6);
    F("#s1-bubble", { opacity: 0, scale: 0.2, svgOrigin: "930 440" }, { opacity: 1, scale: 1.12, duration: 0.45, ease: "back.out(2.6)" }, 2.75);
    F("#s1-bubble", { y: 0 }, { y: -120, duration: 0.6, ease: "power3.out" }, 3.1);   // rises out of the frame top
    F("#s1-robot", { scale: 0, svgOrigin: "1090 270" }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, 3.15);
    [0, 1, 2, 3].forEach(i => F("#s1-antenna", { rotation: i % 2 ? 14 : -14, svgOrigin: "1090 222" }, { rotation: i % 2 ? -14 : 14, duration: 0.18, ease: "sine.inOut" }, 3.5 + i * 0.18));
    // "robot brain" lands: his eyes light up, a grin
    F("#s1-mouth", { attr: { d: "M -16 -262 Q 0 -250 16 -262" } }, { attr: { d: "M -20 -264 Q 0 -238 20 -264" }, duration: 0.2 }, 3.5);
    F("#s1-elon-body", { scaleY: 1, svgOrigin: "860 800" }, { scaleY: 0.93, duration: 0.12, ease: "power2.in" }, 3.55);
    F("#s1-elon-body", { scaleY: 0.93 }, { scaleY: 1, duration: 0.35, ease: "elastic.out(1.2, 0.4)" }, 3.67);

    window.__timelines["s1"] = tl;
  </script>
</template>
