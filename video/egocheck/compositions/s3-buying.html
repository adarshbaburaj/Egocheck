          <feDisplacementMap in="SourceGraphic" scale="3.2" />
        </filter>
        <g id="s3-tapeEGO" class="s3-tape">
          <rect x="-58" y="-30" width="116" height="60" rx="8" fill="#f2f2ee" stroke="#0a0a0a" stroke-width="3" />

    <div class="s3-meter">

    <div id="s3-c1" class="s3-cap clip" data-start="0.3" data-duration="1.8">So he buys data.</div>
    <div id="s3-c2" class="s3-cap clip" data-start="2.1" data-duration="2.8">Egocentric video. UMI.</div>
    <div id="s3-c3" class="s3-cap clip" data-start="4.9" data-duration="1.3"><b>Lots</b> of it.</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const seen = new Set();
    const F = (t, f, v, at) => { const els = gsap.utils.toArray(t); v.immediateRender = !els.some(e => seen.has(e)); els.forEach(e => seen.add(e)); return tl.fromTo(t, f, v, at); };
    const D = 7;
    tl.fromTo("#s3-turb", { attr: { seed: 1 } }, { attr: { seed: 1 + D * 12 }, duration: D, ease: `steps(${D * 12})` }, 0);
    ["#s3-c1", "#s3-c2", "#s3-c3"].forEach((c, i) => F(c, { opacity: 0, scale: 1.5, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.2)" }, [0.3, 2.1, 4.9][i]));

    // stalls pop up from the floor
    F("#s3-stallA", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.2);
    F("#s3-stallB", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.35);
    F(".s3-meter", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.6);
    F(".s3-note", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.0);

    // 12 tapes arc in from the stalls; the stack outgrows the screen
    const N = 12;
    for (let i = 1; i <= N; i++) {
      const t0 = 0.9 + (i - 1) * 0.3;
      const fromX = (i % 2 ? 1180 : 1500) - 716;
      const k = `#s3-k${i}`;
      const landY = 570 - (i - 1) * 58;
      const dy = 560 - landY;                         // start at the stall counter height
      F(k, { x: fromX, opacity: 0, rotation: 0, svgOrigin: `620 ${landY}` }, { x: 0, opacity: 1, rotation: (i % 3 - 1) * 4, duration: 0.42, ease: "power1.inOut" }, t0);
      F(k, { y: dy }, { y: Math.min(dy, 0) - 160, duration: 0.21, ease: "power2.out" }, t0);
      F(k, { y: Math.min(dy, 0) - 160 }, { y: 0, duration: 0.21, ease: "power2.in" }, t0 + 0.21);
    }
    // counters tick with every tape
    const meter = { h: 0, m: 0 };
    F(meter, { h: 0, m: 0 }, { h: 5000, m: 150000, duration: N * 0.3, ease: "none",
      onUpdate: () => {
        document.getElementById("s3-hours").textContent = Math.round(meter.h).toLocaleString("en-US");
        document.getElementById("s3-money").textContent = "$" + (Math.round(meter.m / 1000) * 1000).toLocaleString("en-US");
      } }, 1.1);
    // the bag deflates as he pays
    F("#s3-bag", { scale: 1, svgOrigin: "500 804" }, { scale: 0.45, duration: N * 0.3, ease: "power1.in" }, 1.1);
    // knees buckle under the weight; eyes look up at the tower
    F("#s3-elon", { scaleY: 1, svgOrigin: "620 800" }, { scaleY: 0.9, duration: N * 0.3, ease: "power1.in" }, 1.1);
    F("#s3-eyes", { y: 0 }, { y: -8, duration: 0.3 }, 3.5);
    // the tower wobbles, out past the top of the screen
    [0, 1, 2, 3, 4].forEach(i => F("#s3-stack", { rotation: i % 2 ? 4 : -4, svgOrigin: "620 600" }, { rotation: i % 2 ? -4 : 4, duration: 0.3, ease: "sine.inOut" }, 4.6 + i * 0.3));
    F("#s3-stack", { rotation: 4 }, { rotation: 0, duration: 0.3, ease: "sine.out" }, 6.1);

    window.__timelines["s3"] = tl;
  </script>
